name: Publicar revista Asteriums
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/publish.yml']
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Descargar paquete original
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download v1.0.0 --repo "$GITHUB_REPOSITORY" --pattern Asteriums_Web_Lista_Para_Publicar.zip
      - name: Verificar y extraer
        run: |
          echo "70f7f2fee2e9dbf81bac8f99e0f900f7cb4168761ed73af7469277bff3162a89  Asteriums_Web_Lista_Para_Publicar.zip" | sha256sum --check
          unzip -q Asteriums_Web_Lista_Para_Publicar.zip -d package
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path("package/asteriums-web")
          manifest = json.loads((root / "asset-manifest.json").read_text())
          for resource in manifest["resources"].values():
              file = root / resource["path"]
              assert file.stat().st_size == resource["bytes"], str(file)
              assert hashlib.sha256(file.read_bytes()).hexdigest() == resource["sha256"], str(file)
          assert len(list((root / "assets/videos").glob("*.mp4"))) == 14
          assert len(list((root / "assets/pages").glob("*.webp"))) == 46
          assert len(list((root / "assets/thumbnails").glob("*.png"))) == 60
          print("Integridad verificada: 60 paginas, 14 MP4 originales y perfiles.")
          PY
      - name: Aplicar el visor de libro
        run: cp web/* package/asteriums-web/
      - name: Crear descarga actualizada
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd package
          zip -qr ../Asteriums_Revista_Flipbook.zip asteriums-web
          cd ..
          if gh release view v1.1.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v1.1.0 Asteriums_Revista_Flipbook.zip --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create v1.1.0 Asteriums_Revista_Flipbook.zip --target "$GITHUB_SHA" --title "Asteriums · Revista con efecto de libro" --notes "Visor con giro de hojas, lomo y grosor de páginas. Incluye las 60 páginas, los 14 videos originales y los 84 perfiles." --repo "$GITHUB_REPOSITORY"
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: package/asteriums-web
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
